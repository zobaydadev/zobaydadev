<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Illustration of a laptop showing a test report with passed and failed checks">
  <rect width="480" height="300" rx="16" fill="#ffffff"/>

  <!-- floor / desk -->
  <rect x="30" y="252" width="420" height="8" rx="4" fill="#e2e8f0"/>

  <!-- laptop base -->
  <path d="M92 236 H388 L404 252 H76 Z" fill="#cbd5e1"/>
  <rect x="215" y="241" width="50" height="5" rx="2.5" fill="#94a3b8"/>

  <!-- laptop screen -->
  <rect x="106" y="62" width="268" height="176" rx="12" fill="#1e1b4b"/>
  <rect x="116" y="72" width="248" height="156" rx="6" fill="#f8fafc"/>

  <!-- window bar -->
  <rect x="116" y="72" width="248" height="22" rx="6" fill="#eef2ff"/>
  <circle cx="130" cy="83" r="4" fill="#f87171"/>
  <circle cx="144" cy="83" r="4" fill="#fbbf24"/>
  <circle cx="158" cy="83" r="4" fill="#4ade80"/>
  <text x="240" y="87" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#4f46e5" font-weight="700">Test report</text>

  <!-- row 1: pass -->
  <circle cx="140" cy="116" r="9" fill="#16a34a"/>
  <path d="M135.5 116 l3 3 l6 -6.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="158" y="111" width="130" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="296" y="111" width="50" height="10" rx="5" fill="#bbf7d0"/>

  <!-- row 2: pass -->
  <circle cx="140" cy="146" r="9" fill="#16a34a"/>
  <path d="M135.5 146 l3 3 l6 -6.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="158" y="141" width="104" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="270" y="141" width="76" height="10" rx="5" fill="#bbf7d0"/>

  <!-- row 3: fail -->
  <circle cx="140" cy="176" r="9" fill="#dc2626"/>
  <path d="M136 172 l8 8 M144 172 l-8 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="158" y="171" width="146" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="312" y="171" width="34" height="10" rx="5" fill="#fecaca"/>

  <!-- summary bar -->
  <rect x="130" y="200" width="216" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="130" y="200" width="144" height="12" rx="6" fill="#4f46e5"/>
  <text x="282" y="210" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#475569" font-weight="700">67% pass</text>

  <!-- coffee cup -->
  <rect x="40" y="206" width="44" height="46" rx="8" fill="#f97316"/>
  <path d="M84 218 q18 0 18 14 q0 14 -18 14" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <path d="M52 198 q-6 -9 0 -18 M66 198 q-6 -9 0 -18" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- plant -->
  <path d="M418 214 q-26 -10 -22 -42 q26 8 22 42 Z" fill="#22c55e"/>
  <path d="M418 214 q24 -14 24 -44 q-26 10 -24 44 Z" fill="#16a34a"/>
  <path d="M418 214 q-4 -22 4 -48 q10 24 -4 48 Z" fill="#4ade80"/>
  <path d="M398 212 H438 L433 252 H403 Z" fill="#b45309"/>

  <!-- magnifier -->
  <circle cx="64" cy="92" r="16" fill="none" stroke="#4f46e5" stroke-width="5"/>
  <path d="M76 104 l16 16" stroke="#4f46e5" stroke-width="6" stroke-linecap="round"/>

  <!-- bug -->
  <ellipse cx="426" cy="96" rx="11" ry="14" fill="#ef4444"/>
  <circle cx="426" cy="80" r="6" fill="#b91c1c"/>
  <path d="M415 90 l-9 -5 M415 98 l-10 2 M415 106 l-9 6 M437 90 l9 -5 M437 98 l10 2 M437 106 l9 6" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
</svg>
